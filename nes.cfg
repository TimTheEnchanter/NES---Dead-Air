# 256 KB MMC3: 32 banks of 8 KB. Bank 0 at $8000; bank 1 or a story bank at $A000;
# banks 30 and 31 fixed at $C000.
MEMORY {
  ZP:    start=$0000, size=$0100, type=rw;
  STATSM:start=$0300, size=$0040, type=rw;
  RAM:   start=$0340, size=$04C0, type=rw;
  WRAMM: start=$6000, size=$1F00, type=rw;
  SAVEM: start=$7F00, size=$0100, type=rw;
  HDR:   start=$0000, size=$0010, file=%O, fill=yes;
  B0:    start=$8000, size=$2000, file=%O, fill=yes;
  B1:    start=$A000, size=$2000, file=%O, fill=yes;
  B2:    start=$A000, size=$2000, file=%O, fill=yes;
  B3:    start=$A000, size=$2000, file=%O, fill=yes;
  B4:    start=$A000, size=$2000, file=%O, fill=yes;
  BFREE: start=$0000, size=$32000, file=%O, fill=yes;
  B30:   start=$C000, size=$2000, file=%O, fill=yes;
  B31:   start=$E000, size=$2000, file=%O, fill=yes;
}
SEGMENTS {
  ZEROPAGE: load=ZP,  type=zp;
  STATS:    load=STATSM, type=bss;
  BSS:      load=RAM, type=bss;
  WRAM:     load=WRAMM, type=bss;
  SAVE:     load=SAVEM, type=bss;
  HEADER:   load=HDR, type=ro;
  MATH:     load=B0,  type=ro;
  FLIGHT:   load=B1,  type=ro;
  ASSETS:   load=B2,  type=ro;
  SCRIPT1:  load=B3,  type=ro;
  SCRIPT2:  load=B4,  type=ro;
  CODE:     load=B30, type=ro;
  HIGH:     load=B31, type=ro;
  LOOPS:    load=B31, type=ro, start=$F000;
  VECTORS:  load=B31, type=ro, start=$FFFA;
}
